services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: 3000
      HOSTNAME: 0.0.0.0
    volumes:
      - ./data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
