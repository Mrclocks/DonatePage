services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
